server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # API auth/session endpoints must reach the same backend that serves streams.
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }

    # Every playlist, segment, and key must pass through backend auth.
    location ~ ^/(license1|license2|parking1|parking2|license|parking)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: serve static assets directly (customize as needed)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public";
    }
}
